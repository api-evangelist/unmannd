name: Unmannd
description: >-
  Unmannd (Unmannd Autonomy Pvt Ltd) is an India-based defense technology
  company backed by Accel and Speciale Invest, engineering autonomous drones
  under the banner of aerial dominance. Its TITAN 30 is an autonomous
  defense-logistics drone with a 30 kg max payload, 60 km/h cruise speed,
  20,000 ft operational ceiling, and 30 km max range; its FURY counter-UAS
  interceptor was announced as launching in Q1 2026. Unmannd is a
  hardware/defense company and publishes no public API, developer portal,
  or SDKs as of July 2026.
